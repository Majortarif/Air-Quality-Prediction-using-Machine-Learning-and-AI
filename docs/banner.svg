<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-label="Air Quality Prediction using Machine Learning and AI: live Dhaka AQI, US EPA breakpoints and a Random Forest running in the browser.">
<style>
.s{font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}
.m{font-family:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace}
.t{font-size:13px;fill:#7f949d}
.c{font-size:14.5px;fill:#cfdde2;font-weight:600}
.p{fill:#a9dcff;opacity:0;animation:drift linear infinite}
@keyframes drift{0%{transform:translate(0,0);opacity:0}15%{opacity:.45}85%{opacity:.3}100%{transform:translate(-60px,-70px);opacity:0}}
.rise{animation:rise 1s cubic-bezier(.2,.8,.2,1) both}
.d1{animation-delay:.1s}.d2{animation-delay:.25s}.d3{animation-delay:.4s}.d4{animation-delay:.6s}.d5{animation-delay:.3s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.ping{animation:ping 1.8s cubic-bezier(0,0,.2,1) infinite;transform-box:fill-box;transform-origin:center}
@keyframes ping{0%{transform:scale(1);opacity:.8}80%,100%{transform:scale(3);opacity:0}}
.scan{animation:scan 6s linear infinite}
@keyframes scan{0%{transform:translateY(-80px)}100%{transform:translateY(460px)}}
@media (prefers-reduced-motion: reduce){.p,.rise,.ping,.scan{animation:none}.p{opacity:.3}}
</style>
